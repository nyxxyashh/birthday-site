<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Screen 5 🎉</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(120deg,#ffdde1,#ee9ca7);
    font-family:Arial;
}

.card{
    background:white;
    width:420px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    border:5px solid #5a2c0f;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

h2{
    color:#c2185b;
}

p{
    font-size:15px;
    color:#333;
    line-height:1.6;
}

.heart{
    font-size:40px;
    animation:beat 1s infinite;
}

@keyframes beat{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}
</style>

</head>

<body>

<div class="card">

    <h2>💖 Final Message 💖</h2>

    <div class="heart">💗</div>

    <p>
        Aaj ka ye special birthday surprise yahi end hota hai 🎂✨<br><br>

        Bas itna kehna chahta hoon ki tum hamesha khush raho 😊  
        Tumhari life me har din ek nayi smile aaye 💫  
        Aur tum jo bhi karo usme success mile 💖<br><br>

        Thank you for being special in this journey ✨  
        Happy Birthday once again 🎉🎂  
    </p>

</div>

</body>
</html>
